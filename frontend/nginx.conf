server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Upload limit is enforced by the backend (20 MB); allow a little headroom here.
    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://backend:8081;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
        # Stream the error-report CSV instead of buffering it.
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
